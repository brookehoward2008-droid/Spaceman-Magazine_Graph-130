        <header class="article-title">
          <p class="kicker">Gallery</p>
          <h1>Stills from Spaceman #3</h1>
          <p class="deck">
            A four-column grid of scanned stills from the April 1962 issue,
            with caption overlays — built to Artboard 3 of the wireframes.
          </p>
        </header>
      </article>

      <!--
        To fill a slot, save a still as images/gallery/still-01.jpg (02, 03, …)
        and replace the placeholder div with an image, e.g.:

          <figure class="gallery-item">
            <img src="../images/gallery/still-01.jpg" alt="Describe the still" />
            <figcaption>Caption for the still.</figcaption>
          </figure>
      -->
      <section class="gallery-grid">
        <figure class="gallery-item">
          <div class="slot">STILL 01</div>
          <figcaption>images/gallery/still-01.jpg</figcaption>
        </figure>

        <figure class="gallery-item">
          <div class="slot">STILL 02</div>
          <figcaption>images/gallery/still-02.jpg</figcaption>
        </figure>

        <figure class="gallery-item">
